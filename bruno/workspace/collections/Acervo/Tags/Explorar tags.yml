info:
  name: Explorar tags
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/tags-to-explore"
  body:
    type: json
    data: |-
      {
        "pagination":{
          "limit": 24
        }
      }
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
