info:
  name: Listar autores
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/authors"
  body:
    type: json
    data: |-
      {
        "filter":{
          "search":"chico",
          "author":[],
          "publisher":[],
          "tag":[],
          "category":[]
        },
        "pagination":{
          "limit":1000000,
          "page":1,
          
          "sort":[{
            "by":"search_score",
            "order": "desc"
          },{
            "by":"volumes_count",
            "order": "desc"
          }]
        }
      }
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
