info:
  name: Listar autores
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/authors"
  body:
    type: json
    data: |-
      {
        "filter":{
          "is_spirit":false
        },
        "pagination":{
          "limit":10,
          "sort":{
            "by": "search_name",
            "order":"asc"
          }
        }
      }
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
