info:
  name: Listar Editoras
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}/public/publishers"
  body:
    type: json
    data: |-
      {
        "pagination":{
          "limit":"4",
          "page":"2",
          "orderBy":{
            "id":"desc"
          }
        }
      }
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
