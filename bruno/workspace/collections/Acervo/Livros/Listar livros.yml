info:
  name: Listar livros
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/public/books"
  body:
    type: json
    data: |-
      {
        "filter":{
          "search":"ave, cristo!"
        },
        
        
        "pagination":{
          "limit":"4",
          "page":"2",
          "orderBy":{
            "id":"desc"
          }
        }
      }
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
