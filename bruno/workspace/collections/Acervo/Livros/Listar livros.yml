info:
  name: Listar livros
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/public/books"
  body:
    type: json
    data: |-
      {
        "pagination":{
          "limit":"3",
          "page":"1"
        }
      }
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
