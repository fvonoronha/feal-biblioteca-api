info:
  name: Listar volumes relacionados
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}/volume/1000007/related-volumes"
  body:
    type: json
    data: |-
      {
        "filterX":{
          "search":"chico",
          "author":[],
          "category":["1000006"]
        },
        
        "pagination":{
          "limit":12,
          "page": 1,
          "sort":{
            "by":"search_score",
            "order":"desc"
          }
        }
      }
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
